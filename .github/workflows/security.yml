name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install checksum-pinned scanners
        run: node scripts/install-security-tools.cjs
      - name: Verify security rules using synthetic fixtures
        run: node scripts/security-scan.cjs --test-rules
      - name: Scan dependencies, Git history, pending sources and production code
        run: node scripts/security-scan.cjs
