name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - run: npm --prefix tests/ui ci
      - run: npm --prefix tests/ui run lint
      - run: npm --prefix tests/ui test
      - run: npm --prefix tests/ui run build:js
      - name: Test generated JavaScript with synthetic UI fixtures
        run: RUSTDL_JS_TEST_DIR="$PWD/target/minified-js" npm --prefix tests/ui test
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test the push guard
        run: python3 tests/integration/test_changelog_guard.py
      - name: Require release notes for changed content
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-changelog.py --range "$BASE" "$HEAD"
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - run: npm --prefix tests/ui ci
      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --manifest-path native-ui/Cargo.toml --check
      - name: Test
        run: cargo test --release
      - name: Test with minified embedded JavaScript
        run: cargo test --release --features minified-js
      - name: Fetch pinned Android platform jar
        run: |
          url=https://raw.githubusercontent.com/Sable/android-platforms/1e98db1a199e8f7f85541af26bfc27019501b132/android-35/android.jar
          mkdir -p android/platform
          curl -L --fail --retry 3 -o android/platform/android.jar "$url"
          echo "4566663c3876e022b4fa4ced8c8697c4ab1688267f090114fd92d027b32e619b  android/platform/android.jar" | sha256sum --check
      - name: Fetch pinned native UI crates for offline fixtures
        run: cargo fetch --locked --manifest-path native-ui/Cargo.toml
      - name: Test fixed native navigation destinations
        run: python3 tests/integration/test_native_home.py
      - name: Test network policy in isolation
        run: cargo test --release native_network_policy -- --ignored --test-threads=1
