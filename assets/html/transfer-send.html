<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send to RustDL</title><style>{PEER_CSS}</style></head><body><main><div class="top"><div><span class="eyebrow">Encrypted device transfer</span><h1>Send nearby.</h1><p>Sending <strong>{display_filename}</strong> directly over your local network.</p></div><a class="back" href="/">← Gallery</a></div><section class="panel">{paired}<form action="/peers/send/start" method="post"><input type="hidden" name="file" value="{form_filename}"><label><span>Receiver address</span><input name="address" inputmode="url" placeholder="192.168.1.20:37660" required></label><label><span>One-time pairing key</span><input name="key" autocapitalize="off" autocomplete="off" spellcheck="false" minlength="64" maxlength="64" required></label><button type="submit">Start encrypted transfer</button></form><p class="status">Both devices must be on the same Wi-Fi or hotspot. The receiver must have its Device transfer page open.</p></section></main>{dev_reload}</body></html>
