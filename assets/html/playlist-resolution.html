<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparing playlist</title><style>{css}progress{{width:100%;accent-color:#70dfc9;height:1.4rem}}.preparation{{display:grid;gap:1rem;padding:1rem;border:1px solid #ffffff24;border-radius:16px;background:#11131b}}.continue{{display:block;padding:1rem;border-radius:14px;background:#70dfc9;color:#07110f;text-align:center;font-weight:800;text-decoration:none}}[hidden]{{display:none!important}}li{{overflow-wrap:anywhere;margin:.7rem 0}}</style></head><body><main id="playlist-resolution" data-job="{token}"><header><div><span class="eyebrow">Preparing your selection</span><h1>Finding formats</h1><p>Your selected videos are being checked. You can leave this page and return while preparation continues.</p></div><a href="/">Gallery</a></header><section class="preparation"><p id="resolution-status" role="status">Loading progress…</p><progress id="resolution-progress" max="1" value="0" aria-label="Videos checked"></progress><p id="resolution-time"></p><a id="resolution-continue" class="continue" href="/playlist/formats?job={token}" hidden>Choose formats</a><form id="resolution-cancel" action="/playlist/cancel" method="post"><input type="hidden" name="job" value="{token}"><button type="submit">Cancel preparation</button></form><details id="resolution-errors" hidden><summary id="resolution-errors-summary">Unavailable videos</summary><ul id="resolution-error-list"></ul></details></section><noscript>JavaScript is needed for live progress. Reload this page after enabling it.</noscript></main><script>{script}</script></body></html>
