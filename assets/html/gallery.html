<section class="library" id="gallery-library">{collection_nav}<div class="library-head"><h2>{library_heading}</h2><span class="library-count">{library_summary}</span></div><div class="gallery-tools"><input class="gallery-search" type="search" placeholder="Search gallery or playlists" aria-label="Search gallery" autocomplete="off"><div class="gallery-filters" aria-label="Gallery filters"><button type="button" data-gallery-filter="all" aria-pressed="true">All</button><button type="button" data-gallery-filter="playlists" aria-pressed="false">Playlists</button><button type="button" data-gallery-filter="video" aria-pressed="false">Video</button><button type="button" data-gallery-filter="audio" aria-pressed="false">Audio</button><button type="button" data-gallery-filter="downloading" aria-pressed="false">Downloading</button></div><span class="gallery-filter-status" aria-live="polite"></span><span class="playback-queue-status" aria-live="polite">Up Next · empty</span></div><div class="gallery" id="gallery-items">{initial_cards}<p class="gallery-empty" id="gallery-empty" hidden>No gallery items match this search.</p><span class="gallery-sentinel" id="gallery-sentinel" aria-hidden="true"></span></div><script type="application/json" id="gallery-data">{gallery_json}</script></section>
