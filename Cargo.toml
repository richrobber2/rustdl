[package]
name = "rustdl"
version = "0.1.45"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dev = []
minified-js = []
heap-profile = ["dep:dhat"]

[[bin]]
name = "rustdl-heap-profile"
path = "src/heap_profile_main.rs"
required-features = ["heap-profile"]
test = false
bench = false

[[bin]]
name = "rustdl-page-bench"
path = "src/page_bench_main.rs"
required-features = ["heap-profile"]
test = false
bench = false

[dependencies]
dhat = { version = "=0.3.3", optional = true }
blake3 = "1.8"
memchr = "2.8"
chacha20poly1305 = "0.10"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# QuickJS 0.9 ships desktop bindings, but Android needs generated bindings.
# Keep this feature override aligned with RustyPipe's transitive QuickJS version.
rquickjs-sys = { version = "0.9.0", features = ["bindgen"] }

[profile.release]
lto = false
strip = true
codegen-units = 8

[profile.profiling]
inherits = "release"
debug = 1
strip = false
