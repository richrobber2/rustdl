[package]
name = "rustdl-native-ui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "rustdl_ui"
crate-type = ["cdylib"]

[dependencies]
gpui-kit = { git = "https://github.com/richrobber2/gpui-kit", rev = "abe0fd8fb0982fa154b91f8033ac86c4552e2de8", default-features = false, features = ["component"] }
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "9075e3aa3eea812127f2c60ed66f0cd5798ff245", default-features = false }
jni = "0.22"
ndk = { version = "0.9", features = ["nativewindow"] }
android-activity = { version = "0.6", features = ["native-activity"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
accesskit = "=0.24.1"

[profile.dev]
debug = 0
incremental = false

# Avoid optional Vulkan debug-utils entry points on Android drivers.
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
strip = true
panic = "abort"

# UI dependencies and lockfile stay independent of the download engine.
[workspace]
